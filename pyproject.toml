[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-compiler"
version = "0.1.0"
description = "An educational DSL compiler and simulated mission VM for spacecraft mission logic."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
